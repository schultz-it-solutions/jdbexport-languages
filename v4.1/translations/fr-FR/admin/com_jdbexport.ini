COM_JDBEXPORT_CONFIG_CACHETYPE_DESC="jDBexport utilise une moyenne d'environ 1k / cellule dans les feuilles de calcul, de sorte que les grands classeurs peuvent utiliser rapidement la mémoire disponible. La cellule mise en mémoire cache fournit un mécanisme qui permet à jDBexport de maintenir les objets de cellules dans une plus petite taille de mémoire sur le disque, ou en APC, memcache ou WinCache plutôt que dans la mémoire PHP. Cela permet de réduire l'utilisation de la mémoire pour les grands classeurs, mais avec une pénalisation de vitesse d'accès aux données cellulaires."

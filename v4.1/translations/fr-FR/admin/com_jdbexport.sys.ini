; jdbexport Datafield plugin textstrings
PLG_JDBEXPORTFIELD="plugin JDBexport datafield"
PLG_JDBEXPORTFIELD_XML_DESCRIPTION="<h1>jDBexport datafield plugin by<br>Schultz IT Solutions</h1><p>The jDBexport datafield plugin allows to include a single cell from a jDBexport worksheet into any JOOMLA content element.<br>Usage: Place the tags {jdbexportfield}Workbook_ID:Worksheet_ID:Cell_COORDINATE{/jdbexportfield} in any content item.</p><p>Please refer to <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> for more information.</p>"
; *******************************************************************************************************

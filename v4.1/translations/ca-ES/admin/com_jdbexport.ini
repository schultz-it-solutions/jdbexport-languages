COM_JDBEXPORT_CONFIG_CACHETYPE_DESC="jDBexport utilitza una mitjana del voltant d'1 k / per cel·la en els fulls de treball, per la qual cosa els llibres de grans dimensions poden consumir ràpidament la memòria disponible. L'emmagatzematge en memòria cau de la cèl·lula proporciona un mecanisme que permet al jDBexport mantenir els objectes de la cel·la en una mida més petita a la memòria, en el disc, o en APC, Memcache o Wincache, en lloc de a la memòria del PHP. Això permet reduir l'ús de memòria per a llibres de grans dimensions, encara que a un cost de velocitat per accedir a les dades de la cel·la."

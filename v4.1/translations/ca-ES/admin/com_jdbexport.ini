COM_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport per Schultz IT Solutions</h1><p>jDBexport permet enviar les dades des de les teves bases de dades diractement als usuaris. Escriu qualsevol sentència de SQL a la configuració d'aquest mòdul.  La consulta s'executa quan l'usuari fa click sobre l'enllaç i la informació actual de la base de dades s'envia a l'usuari a través del navegador com a fitxer Excel.</p><p>Per favor, consulta <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> per més informació."


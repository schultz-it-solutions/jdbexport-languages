; jdbexport Installation package textstrings
PKG_JDBEXPORT="Paquet jDBexport"
PKG_JDBEXPORT_XML_DESCRIPTION="<h1>Paquet d'instal·lació del jDBexport per <br>Schultz IT Solutions</h1><p>Aquest és el paquet d'instal·lació principal (inclou el component, el mòdul d'administració i del lloc, els connectors dells camps de dades i graelles de dades, els connectors d'enllaços als llibres de treball i tots els idiomes disponibles.</p><p>Per favor, adreça't a <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> per més informació.</p>"
; *******************************************************************************************************
; jdbexport Datafield plugin textstrings
PLG_JDBEXPORTFIELD="Connector de camps de dades del jDBexport"
PLG_JDBEXPORTFIELD_XML_DESCRIPTION="<h1>Connector de camps de dades jDBexport per <br>Schultz IT Solutions</h1><p>El connector de camps de dades jDBexportpermet incloure una sola cel·la d'un full de treball del jDBexport worksheet dins de qualsevol element de contingut del JOOMLA.<br>Normes d'us: Emplaçar les eqiquetes {jdbexportfield}Workbook_ID:Worksheet_ID:Cell_COORDINATE{/jdbexportfield} en qualsevol element de contingut.</p><p>Per favor, adreça't a <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> per més informació.</p>"
; *******************************************************************************************************
; jdbexport Datagrid plugin textstrings
PLG_JDBEXPORTGRID="Connector de graella de dades del jDBexport"
PLG_JDBEXPORTGRID_CONFIG_MAXROWS_DESC="Número màxim de files per mostrar"
PLG_JDBEXPORTGRID_CONFIG_MAXROWS_LABEL="Màxim de files per mostrar"
PLG_JDBEXPORTGRID_CONFIG_SHOWROWCOUNT_DESC="Mostra el número de files seleccionades"
PLG_JDBEXPORTGRID_CONFIG_SHOWROWCOUNT_LABEL="Mostra el número de files"
PLG_JDBEXPORTGRID_XML_DESCRIPTION="<h1>Connector de graelles de dades del jDBexport per <br>Schultz IT Solutions</h1><p>El connector de graelles de dades del jDBexport permet incloure els llibres de treball del jDBexport dins de qualsevol elemen de contingut del JOOMLA.<br>Normes d'us: Emplaçar les eqiquetes {jdbexportgrid}Workbook_ID:Worksheet_ID{/jdbexportgrid} en qualsevol element de contingut.</p><p>Per favor, adreça't a <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> per més informació.</p>"
; *******************************************************************************************************
; jdbexport Workbook-link plugin textstrings
PLG_JDBEXPORTWBLINK="Connector d'enllaços al llibre de treball de jDBexport"
PLG_JDBEXPORTWBLINK_XML_DESCRIPTION="<h1>Connector d'enllaços als llibres de treball del jDBexport per<br>Schultz IT Solutions</h1><p>Connector d'enllaços als llibres de treball del jDBexport permet incloure un enllaç a un llibre de treball determinat dins de qualsevol element de contingut del JOOMLA.<br>Normes d'us: Emplaçar les etiquetes {jdbexportwblink}WORKBOOK_ID:LINK_TEXT:LINK_TARGET:LINK_CSSCLASS:TASK{/jdbexportwblink} en qualsevol element de contingut.</p><p>Per favor, adreça't a <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> per més informació.</p>"
PLG_JDBEXPORTWBLINK_CSSCLASS_DESC="Defineix les classes del full d'estils (CSS) que s'aplicaran a l'enllaç del llibre de treball"
PLG_JDBEXPORTWBLINK_CSSCLASS_LABEL="Classes CSS"
PLG_JDBEXPORTWBLINK_TARGET_DESC="Defineix com s'obre l'enllaç al llibre de treball. Per defecte és: 'a la mateixa finestra, amb plantilla'"
PLG_JDBEXPORTWBLINK_TARGET_LABEL="Destinació de l'enllaç"
PLG_JDBEXPORTWBLINK_TASK_DESC="Defineix la tasca per executar quan s'activi l'enllaç. Per defecte és: 'descarrega el document'"
PLG_JDBEXPORTWBLINK_TASK_LABEL="Tasca"

; jdbexport ttfonts module textstrings
MOD_JDBEXPORT_TTFONTS="Mòdul ttfonts del jDBexport"
MOD_JDBEXPORT_TTFONTS_XML_DESCRIPTION="<h1>Mòdul de ttfonts del jDBexport per <br>Schultz IT Solutions</h1><p>El mòdul de ttfonts del jDBexport instal·la fonts addicionals per a la llibreria mPDF dins del directori de mitjans. Aquestes fonts són necessàris per quan es volen crear documents en format PDF.<p>Per favor, adreça't a <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> per més informació.</p>"

; jdbexport Datafield plugin textstrings
PLG_JDBEXPORTFIELD="jDBexport Datafield plugin"
PLG_JDBEXPORTFIELD_XML_DESCRIPTION="<h1>jDBexport datafield plugin från<br>Schultz IT Solutions</h1><p>jDBexport datafield plugin låter dig inkludera en enskild cell från ett jDBexport kalkylblad i vilket JOOMLA innehåll som helst.<br>Användning: Placera taggarna {jdbexportfield}Workbook_ID:Worksheet_ID:Cell_COORDINATE{/jdbexportfield} i texten där du vill att cellinnehållry ska visas.</p><p>Gå till <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> för mer information.</p>"

COM_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport från Schultz IT Solutions</h1><p>jDBexport låter dig hämta data direkt från dina databaser och presentera för dina användare. Skriv en giltig SQL-fråga i den här komponentens konfiguration. SQL-frågan exekveras när en användare klickar på länken och den aktuella informationen i databasen levereras till användarens webbläsare som en Excel-fil.</p><p>Gå till <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> för mer information."

; jdbexport Installation package textstrings
PKG_JDBEXPORT="Pacchetto jDBexport"
PKG_JDBEXPORT_XML_DESCRIPTION="<H1> jDBexport pacchetto di installazione da <br> Solutions Schultz IT </ h1> <p> Questo è il pacchetto di installazione completo (compresa la componente, il backend e il modulo front-end, il DataField e plugin DataGrid e il plugin cartella di lavoro-link, e tutte le lingue disponibili. </ p><p>Perfavore fare riferimento a <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> per maggiori informazioni.</p>"

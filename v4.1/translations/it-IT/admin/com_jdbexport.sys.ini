COM_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport by Schultz IT Solutions</h1><p>jDBexport consente di rendere disponibili i dati dai database direttamente agli utenti. Scrivere tutte le query SQL valide nella configurazione di questo componente. La query viene eseguita quando un utente fa clic sul collegamento e le informazioni correnti nel database viene consegnato al browser degli utenti come un file di Excel.</p><p>Perfavore fare riferimento a <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> per maggiori informazioni."

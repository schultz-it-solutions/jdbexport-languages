PLG_JDBEXPORTGRID_CONFIG_SHOWROWCOUNT_DESC="Mostra il numero di righe selezionate."
PLG_JDBEXPORTGRID_CONFIG_SHOWROWCOUNT_LABEL="Mostra il conteggio del numero di righe"
PLG_JDBEXPORTGRID_XML_DESCRIPTION="<H1> jDBexport datagrid plugin <br> Solutions Schultz IT </ h1> <p> Il datagrid plug jDBexport permette di includere le cartelle di lavoro jDBexport in ogni elemento contenuto JOOMLA <br> Uso:. Posizionare i tag {} jdbexportgrid Workbook_ID: Worksheet_ID { / jdbexportgrid} in ogni elemento di contenuto. </ p><p>Perfavore fare riferimento a <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> per maggiori informazioni."
; *******************************************************************************************************
; jdbexport Workbook-link plugin textstrings
PLG_JDBEXPORTWBLINK="Plugin jDBexport workbooklink "
PLG_JDBEXPORTWBLINK_XML_DESCRIPTION="<H1> jDBexport workbooklink plugin <br> Solutions Schultz IT </ h1> <p> Il workbooklink plug jDBexport permette di includere un link a una singola cartella di lavoro jDBexport in ogni elemento contenuto JOOMLA <br> Uso:. Posizionare i tag {jdbexportwblink } WORKBOOK_ID: LINK_TEXT: LINK_TARGET: LINK_CSSCLASS:. TASK {/ jdbexportwblink} in qualsiasi oggetto di contenuto </ p><p>Perfavore fare riferimento a <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> per maggiori informazioni.</p>"
PLG_JDBEXPORTWBLINK_CSSCLASS_DESC="Definire le classi CSS del foglio(i) di stile da applicare al link cartella di lavoro."
PLG_JDBEXPORTWBLINK_CSSCLASS_LABEL="Classe CSS"
PLG_JDBEXPORTWBLINK_TARGET_DESC="Definire come aprire il link della cartella di lavoro. \nCome impostazione predefinita è  impostato su: 'stessa finestra'."
PLG_JDBEXPORTWBLINK_TARGET_LABEL="Link target"

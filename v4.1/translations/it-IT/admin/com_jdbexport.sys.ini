; jdbexport Datafield plugin textstrings
PLG_JDBEXPORTFIELD="jDBexport plugin campi dati"
PLG_JDBEXPORTFIELD_XML_DESCRIPTION="<H1> jDBexport datafield plugin <br> Schultz IT Solutions </ h1> <p> Il datafield plug jDBexport permette di inserire una singola cella di un foglio jDBexport in ogni elemento contenuto JOOMLA <br> Uso:. Posizionare i tag {jdbexportfield } Workbook_ID: Worksheet_ID:. Cell_COORDINATE {/ jdbexportfield} in qualsiasi oggetto di contenuto </ p><p>Perfavore fare riferimento a <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> per maggiori informazioni."
; *******************************************************************************************************

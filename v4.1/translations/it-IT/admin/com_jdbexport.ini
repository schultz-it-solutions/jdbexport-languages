COM_JDBEXPORT_CONFIG_CACHETYPE_DESC="jDBexport utilizza una media di circa 1k / cellule in fogli di lavoro, in questo modo grandi cartelle di lavoro possono utilizzare rapidamente la memoria disponibile. Il caching delle celle fornisce un meccanismo che permette di ridurre e mantenere lo spazio occupato da jDBexport nella  memoria o su disco, o in APC, memcache o Wincache, piuttosto che nella memoria PHP. Ciò consente di ridurre l'utilizzo della memoria per grandi cartelle di lavoro, anche se a scapito della velocità di accesso ai dati nelle celle."

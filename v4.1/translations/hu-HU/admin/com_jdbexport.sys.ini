COM_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport Schultz IT Solutions</ h1><p>A jDBexport lehetővé teszi, hogy Ön adatokat jelenítsen meg az adatbázisaiból közvetlenül a felhasználók számára. A komponens beállításainál Ön bármilyen érvényes SQL lekérdezést megadhat. A lekérdezés akkor fut le, amikor a felhasználó rákattint a linkre. Ekkor az adatbázis aktuális információi a felhasználó böngészőjében Excel fájl formájában jelennek meg. </p><p> További információkért látogasson el a következő oldalra: <a href='http://it-solutions.schultz.ch' target=_Blank>http://it-solutions.schultz.ch</a>"

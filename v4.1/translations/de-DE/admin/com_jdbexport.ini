COM_JDBEXPORT_WSHELPTABS_NOTES="Diese Registerkarten helfen Ihnen bei der Entwicklung Ihrer SQL Abfrage - Sie bekommen direkte Links zu <b>relevanten Online Dokumentationen</b>, Informationen über Ihre  <b>Datenbank Tabellen</b> und Felder, Sie können Ihre SQL Abfrage auf <b>Syntax Fehler</b> prüfen (entweder LIVE wann immer Sie die Abfrage ändern - vorausgesetzt die entsprechende Einstellung ist in der jDBexport Konfiguration gesetzt, oder nur bei Bedarf indem Sie das entsprechende Icon anklicken)."

COM_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport von Schultz IT Solutions</h1><p>jDBexport erlaubt Ihnen, Daten aus Ihren Datenbanken direkt an Ihre Anwender zu liefern. Schreiben Sie eine gültige SQL Abfrage in der Konfiguration der Komponente. Die Abfrage wird ausgeführt, wenn ein Anwender den Link anklickt, und die aktuellen Informationen aus der Datenbank werden als Excel Dokument an den Webbrowser des Anwenders geschickt.</p><p>Bitte konsultieren Sie <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> für weitere Informationen."


PLG_JDBEXPORTGRID_XML_DESCRIPTION="<h1>jDBexport Datagrid Plugin von<br>Schultz IT Solutions</h1><p>Das jDBexport Datagrid Plugin erlaubt es, jDBexport Arbeitsblätter in beliebige JOOMLA Inhaltselemente einzubinden.<br>Anwendung: Platzieren Sie die Tags {jdbexportgrid}Workbook_ID:Worksheet_ID{/jdbexportgrid} in irgend einem Inhaltselement.</p><p>Bitte konsultieren Sie <a target=\"_QQ_\"_Blank\"_QQ_\" href=\"_QQ_\"https://it-solutions.schultz.ch\"_QQ_\">https://it-solutions.schultz.ch</a>für weitere Informationen.</p>"
; *******************************************************************************************************
; jdbexport Workbook-link plugin textstrings
PLG_JDBEXPORTWBLINK="jDBexport Arbeitsmappen Link Plugin"
PLG_JDBEXPORTWBLINK_XML_DESCRIPTION="<h1>jDBexport Arbeitsmappen Link Plugin von<br>Schultz IT Solutions</h1><p>Das jDBexport Arbeitsmappen Link Plugin erlaubt es, einen Link zu einer einzelnen Arbeitsmappe in beliebige JOOMLA Inhaltselemente einzubinden.<br>Anwendung: Platzieren Sie die Tags {jdbexportwblink}WORKBOOK_ID:LINK_TEXT:LINK_TARGET:LINK_CSSCLASS:TASK{/jdbexportwblink} in irgendeinem Inhaltselement.\n</p><p>Bitte konsultieren Sie <a href=\"_QQ_\"https://it-solutions.schultz.ch\"_QQ_\">https://it-solutions.schultz.ch</a>\nfür weitere Informationen.</p>"
PLG_JDBEXPORTWBLINK_CSSCLASS_DESC="Definieren Sie die CSS Stylesheet Klasse(n), die dem Arbeitsmappen Link zugeteilt sein sollen."
PLG_JDBEXPORTWBLINK_CSSCLASS_LABEL="CSS Klassen"
PLG_JDBEXPORTWBLINK_TARGET_DESC="Definieren Sie, wie der Arbeitsmappen Link geöffnet werden soll. Standardwert ist 'die selbe Browser Registerkarte, mit Template'."
PLG_JDBEXPORTWBLINK_TARGET_LABEL="Link Zielfenster"
PLG_JDBEXPORTWBLINK_TASK_DESC="Definieren Sie die Aufgabe, die beim Anklicken des Links ausgeführt werden soll. Standardwert ist 'Dokument herunterladen'."
PLG_JDBEXPORTWBLINK_TASK_LABEL="Aufgabe"

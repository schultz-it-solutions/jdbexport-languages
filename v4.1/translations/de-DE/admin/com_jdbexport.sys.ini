; jdbexport ttfonts module textstrings
MOD_JDBEXPORT_TTFONTS="jDBexport TTFonts Module"
MOD_JDBEXPORT_TTFONTS_XML_DESCRIPTION="<h1>jDBexport TTFonts Modul von<br>Schultz IT Solutions\n</h1><p>Das jDBexport TTFonts Modul installiert zusätzliche Fonts für die mPDF Bibliothek ins media Verzeichnis. Diese Fonts werden für das Erstellen von PDF Dokumenten benötig.</p><p>Bitte konsultieren Sie\n<a href=\"_QQ_\"https://it-solutions.schultz.ch\"_QQ_\">https://it-solutions.schultz.ch</a>\nfür weitere Informationen.</p>"
; *******************************************************************************************************
; jdbexport Installation package textstrings
PKG_JDBEXPORT="jDBexport Paket"
PKG_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport Installationspaket von<br>Schultz IT Solutions\n</h1><p>Dies ist das gesamte Installationspaket (inklusive der Komponente, den Administrations- und Website-Modulen, dem Datagrid- und dem Datafield-Plugin, sowie aller verfügbaren Übersetzungen.</p><p>Bitte konsultieren Sie\n<a href=\"_QQ_\"https://it-solutions.schultz.ch\"_QQ_\">https://it-solutions.schultz.ch</a>\nfür weitere Informationen.</p>"
; *******************************************************************************************************
; jdbexport Datafield plugin textstrings
PLG_JDBEXPORTFIELD="jDBexport Datafield Plugin"
PLG_JDBEXPORTFIELD_XML_DESCRIPTION="<h1>jDBexport Datafield Plugin von<br>Schultz IT Solutions</h1><p>Das jDBexport Datafield Plugin erlaubt es, eine einzelne Zelle aus einem jDBexport Arbeitsblatt in beliebige JOOMLA Inhaltselemente einzubinden.<br>Anwendung: Platzieren Sie die Tags {jdbexportfield}Workbook_ID:Worksheet_ID:Cell_COORDINATE{/jdbexportfield} in irgend einem Inhaltselement.</p><p>Bitte konsultieren Sie <a target=\"_QQ_\"_Blank\"_QQ_\" href=\"_QQ_\"https://it-solutions.schultz.ch\"_QQ_\">https://it-solutions.schultz.ch</a>für weitere Informationen.</p>"
; *******************************************************************************************************

PKG_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport installation package by<br>Schultz IT Solutions</h1><p>This is the full installation package (including the component, the backend and the frontend module, the datafield and datagrid plugins and the workbook-link plugins, and all available languages.</p><p>Please refer to <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> for more information.</p>"

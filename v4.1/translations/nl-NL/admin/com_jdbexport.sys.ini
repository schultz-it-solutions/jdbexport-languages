; jdbexport Datafield plugin textstrings
PLG_JDBEXPORTFIELD="jDBexport datafield plugin"
PLG_JDBEXPORTFIELD_XML_DESCRIPTION="<h1>jDBexport datafield plugin door<br>Schultz IT Solutions</h1><p>Met de jDBexport datafield plugin kan je een enkele cel van een jDBexport werkmap weergeven in elk mogelijk JOOMLA element.<br>Gebruik: Plaats de tags {jdbexportfield}Werkmap_ID:Werkblad_ID:Cell_COORDINATE{/jdbexportfield} in het element van uw keuze.</p><p>Ga naar <a href='https://it-solutions.schultz.ch'>http://it-solutions.schultz.ch</a> voor meer informatie.</p>"
; *******************************************************************************************************

COM_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport door Schultz IT Solutions</h1><p>Met jDBexport kun je gegevens uit je database rechtstreeks aan je gebruikers aanbieden. Maak een willekeurige geldige SQL query in de configuratie van dit component. De query wordt uitgevoerd als een gebruiker op de link klikt en de actuele informatie uit de database wordt in de browser aangeboden als een Excel bestand.</p><p>Ga naar <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a>voor meer informatie."

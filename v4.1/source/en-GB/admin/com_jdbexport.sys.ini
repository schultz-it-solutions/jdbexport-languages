PLG_JDBEXPORTGRID_CONFIG_SHOWROWCOUNT_DESC="Show the number of rows selected."
PLG_JDBEXPORTGRID_CONFIG_SHOWROWCOUNT_LABEL="Show row count"
PLG_JDBEXPORTGRID_XML_DESCRIPTION="<h1>jDBexport datagrid plugin by<br>Schultz IT Solutions</h1><p>The jDBexport datagrid plugin allows to include jDBexport workbooks into any JOOMLA content element.<br>Usage: Place the tags {jdbexportgrid}Workbook_ID:Worksheet_ID{/jdbexportgrid} in any content item.</p><p>Please refer to <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> for more information.</p>"

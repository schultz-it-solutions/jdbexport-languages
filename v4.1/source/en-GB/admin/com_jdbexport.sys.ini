COM_JDBEXPORT_XML_DESCRIPTION="<h1>jDBexport by Schultz IT Solutions</h1><p>jDBexport allows you to to deliver data from your databases directly to your users. Write any valid SQL query in the configuration of this component. The query is executed when a user clicks the link and the current information in the database is delivered to the users browser as an Excel file.</p><p>Please refer to <a href='https://it-solutions.schultz.ch' target=_Blank>https://it-solutions.schultz.ch</a> for more information."

PLG_JDBEXPORTWBLINK_CSSCLASS_LABEL="CSS Classes"
PLG_JDBEXPORTWBLINK_TARGET_DESC="Define how to open the workbook link. Default is 'same window, with template'."
PLG_JDBEXPORTWBLINK_TARGET_LABEL="Link target"
PLG_JDBEXPORTWBLINK_TASK_DESC="Define the task to be executed when activating the link. Default is 'download the document'."

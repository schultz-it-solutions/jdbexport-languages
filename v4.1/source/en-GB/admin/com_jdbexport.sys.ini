; jdbexport Workbook-link plugin textstrings
PLG_JDBEXPORTWBLINK="jDBexport workbooklink plugin"
PLG_JDBEXPORTWBLINK_XML_DESCRIPTION="<h1>jDBexport workbooklink plugin by<br>Schultz IT Solutions</h1><p>The jDBexport workbooklink plugin allows to include a link to a single jDBexport workbook into any JOOMLA content element.<br>Usage: Place the tags {jdbexportwblink}WORKBOOK_ID:LINK_TEXT:LINK_TARGET:LINK_CSSCLASS:TASK{/jdbexportwblink} in any content item.</p><p>Please refer to <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> for more information.</p>"

MOD_JDBEXPORT_TTFONTS_XML_DESCRIPTION="<h1>jDBexport ttfonts module by<br>Schultz IT Solutions</h1><p>The jDBexport ttfonts module installs additional fonts for the mPDF library into the media directory. These fonts are needed when creating PDF documents.<p>Please refer to <a href='https://it-solutions.schultz.ch'>https://it-solutions.schultz.ch</a> for more information.</p>"
